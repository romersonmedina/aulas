<title>Avaliação Online</title>
<style>
/* ===================== TEMA ===================== */
:root{
  --bg:#f1f5f9; --bg2:#ffffff; --line:#e2e8f0; --txt:#0f172a; --mut:#64748b;
  --brand:#0f766e; --brand-soft:#ccfbf1;
  --ok:#15803d; --ok-soft:#dcfce7; --err:#b91c1c; --err-soft:#fee2e2;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06); --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --bg2:#111c2e; --line:#1e293b; --txt:#e2e8f0; --mut:#94a3b8;
    --brand:#2dd4bf; --brand-soft:#134e4a;
    --ok:#4ade80; --ok-soft:#14532d; --err:#f87171; --err-soft:#450a0a;
    --warn:#fbbf24; --warn-soft:#451a03;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);line-height:1.55;-webkit-text-size-adjust:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
body.emprova{user-select:none;-webkit-user-select:none}
body.emprova .alt .txt, body.emprova .q pre{user-select:none;-webkit-user-select:none}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
h1,h2,h3{line-height:1.25;margin:0}
h1{font-size:clamp(1.35rem,4vw,1.9rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.05rem;font-weight:750}
p{margin:.5em 0}
.mut{color:var(--mut)} .small{font-size:.85rem} .tiny{font-size:.78rem}
.center{text-align:center} .hidden{display:none !important}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em}

/* ===================== BOTÕES / CAMPOS ===================== */
button{font:inherit;cursor:pointer;border:0;border-radius:10px;transition:.15s}
button:disabled{opacity:.55;cursor:progress}
.btn{background:var(--brand);color:#fff;padding:13px 22px;font-weight:700;font-size:1rem;width:100%}
@media (prefers-color-scheme: dark){ .btn{color:#052e2b} }
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--txt);border:1px solid var(--line);padding:11px 18px;font-weight:600}
.btn-ghost:hover:not(:disabled){border-color:var(--brand)}
.row{display:flex;gap:10px} .row>*{flex:1}
label{display:block;font-weight:650;font-size:.9rem;margin:16px 0 6px}
input,select{
  width:100%;font:inherit;padding:12px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--txt)
}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
select:disabled{opacity:.55}

/* ===================== CABEÇALHO FIXO ===================== */
.top{
  position:sticky;top:0;z-index:40;background:var(--bg2);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap
}
.top .id{font-weight:700;font-size:.9rem;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{
  font-variant-numeric:tabular-nums;font-weight:800;font-size:1.05rem;
  background:var(--brand-soft);color:var(--brand);padding:6px 12px;border-radius:999px
}
.timer.alerta{background:var(--warn-soft);color:var(--warn);animation:pulse 1.2s infinite}
.timer.critico{background:var(--err-soft);color:var(--err);animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.55}}
.barra{height:4px;background:var(--line);border-radius:999px;overflow:hidden;width:100%}
.barra>div{height:100%;background:var(--brand);width:0;transition:width .3s}

/* ===================== QUESTÕES ===================== */
.q{padding:22px 20px;margin-top:18px}
.q .num{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.q .enun{font-size:1.06rem;font-weight:600;margin:8px 0 4px;white-space:pre-wrap}
.q pre{
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  overflow-x:auto;font-size:.88rem;line-height:1.5;margin-top:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace
}
@media (max-width:520px){ .q pre{white-space:pre-wrap;word-break:break-word;font-size:.82rem} }
.alts{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.alt{
  display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1.5px solid var(--line);
  border-radius:11px;cursor:pointer;background:var(--bg);transition:.12s
}
.alt:hover{border-color:var(--brand)}
.alt .letra{
  flex:none;width:27px;height:27px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-weight:800;font-size:.82rem;background:var(--bg2)
}
.alt.sel{border-color:var(--brand);background:var(--brand-soft)}
.alt.sel .letra{background:var(--brand);color:var(--bg2);border-color:var(--brand)}
.alt.certa{border-color:var(--ok);background:var(--ok-soft)}
.alt.errada{border-color:var(--err);background:var(--err-soft)}
.alt .txt{flex:1;padding-top:2px}

/* ===================== NAVEGADOR ===================== */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;margin-top:14px}
.gbtn{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--txt);font-weight:750;font-size:.9rem}
.gbtn.feita{background:var(--brand);color:var(--bg2);border-color:var(--brand)}
.gbtn.atual{outline:2.5px solid var(--brand);outline-offset:2px}

/* ===================== AVISOS ===================== */
.aviso{padding:13px 16px;border-radius:11px;font-size:.9rem;margin-top:14px;border:1px solid}
.aviso.info{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.aviso.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.aviso.err{background:var(--err-soft);border-color:var(--err);color:var(--err)}
.aviso.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.regras{margin:0;padding-left:20px}
.regras li{margin:4px 0}

/* ===================== RESULTADO ===================== */
.nota{font-size:3.4rem;font-weight:900;letter-spacing:-.03em;line-height:1;margin:6px 0}
.protocolo{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.5rem;font-weight:800;
  letter-spacing:.18em;background:var(--bg);border:1px dashed var(--line);padding:12px;border-radius:10px;margin-top:8px
}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.72);display:grid;place-items:center;padding:20px;z-index:90}
.modal .card{max-width:430px;padding:24px;width:100%}
</style>
</head>

    },

      ],
      correta: 1
    },
    {
      enunciado: "Segundo o material, qual é o problema do código abaixo?",
      codigo: '<form action="/buscar">\n  <input type="text" name="cidade" autofocus>\n  <input type="text" name="bairro" autofocus>\n</form>',
      alternativas: [
        "autofocus não pode ser usado em campos do tipo text",
        "Apenas um campo do formulário pode ter autofocus, pois ele define onde o cursor aparece ao carregar a página",

    },
    {
      enunciado: "Um aluno escreveu <textarea name=\"observacao\"></textarea>, sem mais nada. Segundo o material, o que está faltando?",
      alternativas: [
        "O atributo type, obrigatório em qualquer campo",
        "Os atributos rows e cols, que são obrigatórios na textarea e definem linhas e colunas",
        "O atributo value, para guardar o que foi digitado",

      ],

        "<input type=\"submit\" src=\"botao.jpg\">",
        "<input type=\"image\" value=\"botao.jpg\">",
        "<button type=\"submit\"><img src=\"botao.jpg\" border=\"0\"></button>",
        "<submit><img src=\"botao.jpg\"></submit>",

      ],
      correta: 2
    },
    {
      enunciado: "Qual é a função da tag <label> em um formulário?",
      alternativas: [
        "Guardar o valor digitado pelo usuário para o envio",

        "Validar o conteúdo digitado antes do envio",

      ],

    }
  ]
};
</script>

    <button class="btn" id="avisoOk" style="margin-top:18px">Entendi, voltar à prova</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const LETRAS = "ABCDEFGHIJ";
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};

const embaralhar = arr => {
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
};

const CHAVE = "prova_" + (CONFIG.titulo || "x").replace(/\W+/g,"_").toLowerCase();

/* MODO TESTE — só para o professor: acrescente ?teste ao endereço.
   Não pede código, não trava reenvio, não vigia troca de aba,
   mostra o gabarito no fim e marca o envio como TESTE na planilha. */
const MODO_TESTE = /[?&]teste\b/i.test(location.search);

/* Chamada ao Apps Script sem depender de CORS */
function jsonp(url, params, ms){
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const t = setTimeout(() => { limpar(); reject(new Error("tempo esgotado")); }, ms || 12000);
    function limpar(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } s.remove(); }
    window[cb] = dados => { limpar(); resolve(dados); };
    s.onerror = () => { limpar(); reject(new Error("falha de rede")); };
    s.src = url + (url.indexOf("?") >= 0 ? "&" : "?") +
            new URLSearchParams(Object.assign({}, params, { callback: cb })).toString();
    document.head.appendChild(s);
  });
}

/* ================= estado ================= */
let prova = null, respostas = [], atual = 0;
let aluno = { nome:"", turma:"" };
let inicioEm = 0, fimEm = 0, tickTimer = null, enviando = false;
let saidasDaAba = 0, avisosRestantes = 0, vigiando = false;

/* ============================================================
   TELA 1 — ENTRADA
   ============================================================ */
function montarEntrada(){
  $("#inDisc").textContent   = CONFIG.disciplina || "";
  $("#inTitulo").textContent = CONFIG.titulo || "Avaliação";
  $("#inProf").textContent   = CONFIG.professor || "";
  document.title = (CONFIG.titulo||"Avaliação") + " — " + (CONFIG.disciplina||"");

  const turmas = Object.keys(CONFIG.alunos || {});
  $("#cTurma").innerHTML = '<option value="" disabled selected>Selecione sua turma</option>' +
    turmas.map(t => `<option>${esc(t)}</option>`).join("");

  const n = CONFIG.questoes.length;
  const regras = [
    `<strong>${n}</strong> questões de múltipla escolha, de A a E`,
    CONFIG.duracaoMinutos > 0 ? `<strong>${CONFIG.duracaoMinutos} minutos</strong> de duração` : "sem limite de tempo",
    "cada aluno responde <strong>uma única vez</strong>"
  ];
  if(CONFIG.encerrarAoSairDaAba && !MODO_TESTE){
    regras.push(CONFIG.toleranciaSaidas > 0
      ? `sair da aba encerra a prova (você tem <strong>${CONFIG.toleranciaSaidas}</strong> aviso antes)`
      : `<strong>sair da aba encerra a prova imediatamente</strong>`);
  }
  $("#inRegras").innerHTML = "<strong>Antes de começar:</strong><ul class='regras'>" +
    regras.map(r => `<li>${r}</li>`).join("") + "</ul>";

  if(CONFIG.encerrarAoSairDaAba && !MODO_TESTE){
    $("#inExtra").innerHTML = `<div class="aviso warn">Feche os outros aplicativos e silencie as notificações
      antes de iniciar. Trocar de aba, minimizar a janela ou abrir outro app <strong>entrega a prova
      automaticamente</strong>, com as respostas que estiverem marcadas até ali.</div>`;
  }

  if(CONFIG.senha && !MODO_TESTE) $("#boxSenha").classList.remove("hidden");

  if(MODO_TESTE){
    $("#inExtra").innerHTML = `<div class="aviso warn">Modo de teste do professor: sem código de acesso,
      sem vigilância de aba, pode repetir quantas vezes quiser e o gabarito aparece no fim.
      Para os alunos, use o endereço <strong>sem</strong> o <code>?teste</code>.</div>`;
    return;
  }

  const feito = store.get(CHAVE + "_enviado");
  if(feito){
    try{
      const d = JSON.parse(feito);
      $("#formEntrada").innerHTML =
        `<div class="aviso ok" style="margin-top:18px">Esta prova já foi entregue por
         <strong>${esc(d.nome)}</strong>.<br>Protocolo: <strong>${esc(d.protocolo)}</strong></div>
         <p class="tiny mut center" style="margin-top:12px">Se você não é essa pessoa, avise o professor.</p>`;
    }catch(e){ store.del(CHAVE + "_enviado"); }
  }
}

/* turma escolhida -> carrega os nomes daquela turma */
$("#cTurma").addEventListener("change", () => {
  const lista = (CONFIG.alunos && CONFIG.alunos[$("#cTurma").value]) || [];
  const sel = $("#cAluno");
  sel.innerHTML = '<option value="" disabled selected>Selecione seu nome</option>' +
    lista.map(nome => `<option>${esc(nome)}</option>`).join("") +
    (CONFIG.permitirNomeForaDaLista ? '<option value="__outro__">Meu nome não está na lista</option>' : "");
  sel.disabled = false;
  $("#boxNomeLivre").classList.add("hidden");
});

$("#cAluno").addEventListener("change", () => {
  $("#boxNomeLivre").classList.toggle("hidden", $("#cAluno").value !== "__outro__");
});

$("#formEntrada").addEventListener("submit", async e => {
  e.preventDefault();
  const erro = $("#erroEntrada");
  const btn  = $("#btnIniciar");
  erro.classList.add("hidden");

  const turma = $("#cTurma").value;
  let nome = $("#cAluno").value;
  if(nome === "__outro__") nome = $("#cNomeLivre").value.trim();

  if(!turma){ return mostrarErro("Selecione sua turma."); }
  if(!nome || nome.split(/\s+/).length < 2){ return mostrarErro("Selecione (ou digite) seu nome completo."); }
  if(CONFIG.senha && !MODO_TESTE &&
     $("#cSenha").value.trim().toUpperCase() !== String(CONFIG.senha).toUpperCase()){
    return mostrarErro("Código de acesso incorreto.");
  }

  aluno = { nome, turma };

  /* confere na planilha se este aluno já entregou (vale para qualquer aparelho) */
  if(CONFIG.urlPlanilha && !MODO_TESTE){
    btn.disabled = true; btn.textContent = "Verificando sua matrícula…";
    try{
      const r = await jsonp(CONFIG.urlPlanilha, { acao:"verificar", nome, turma, prova: CONFIG.titulo });
      if(r && r.jaFez){
        btn.disabled = false; btn.textContent = "Iniciar prova";
        return mostrarErro("Consta que você já entregou esta prova" +
          (r.protocolo ? " (protocolo " + r.protocolo + ")" : "") + ". Fale com o professor.");
      }
    }catch(err){
      if(CONFIG.bloquearSemVerificacao){
        btn.disabled = false; btn.textContent = "Iniciar prova";
        return mostrarErro("Não foi possível confirmar sua matrícula. Verifique a internet e tente de novo.");
      }
      aluno.naoVerificado = true;   // segue, mas fica registrado na planilha
    }
    btn.disabled = false; btn.textContent = "Iniciar prova";
  }

  iniciarProva();

  function mostrarErro(msg){ erro.textContent = msg; erro.classList.remove("hidden"); }
});

/* ============================================================
   TELA 2 — PROVA
   ============================================================ */
function iniciarProva(){
  const base = CONFIG.questoes.map((q,i) => {
    const alts = q.alternativas.map((texto,idx) => ({ texto, correta: idx === q.correta }));
    return {
      original: i + 1, enunciado: q.enunciado, imagem: q.imagem || null, codigo: q.codigo || null,
      valor: q.valor == null ? 1 : q.valor,
      alternativas: CONFIG.embaralharAlternativas ? embaralhar(alts) : alts
    };
  });
  prova = CONFIG.embaralharQuestoes ? embaralhar(base) : base;
  respostas = new Array(prova.length).fill(null);
  atual = 0;
  avisosRestantes = CONFIG.toleranciaSaidas || 0;

  /* retoma se a página recarregar no meio (queda de internet, celular travou) */
  const rasc = MODO_TESTE ? null : store.get(CHAVE + "_rascunho");
  if(rasc){
    try{
      const d = JSON.parse(rasc);
      if(d.nome === aluno.nome && Array.isArray(d.respostas) && d.respostas.length === prova.length){
        prova = d.prova; respostas = d.respostas; inicioEm = d.inicioEm;
        atual = d.atual || 0; saidasDaAba = d.saidasDaAba || 0;
        avisosRestantes = d.avisosRestantes != null ? d.avisosRestantes : avisosRestantes;
      }
    }catch(e){}
  }
  if(!inicioEm) inicioEm = Date.now();
  fimEm = CONFIG.duracaoMinutos > 0 ? inicioEm + CONFIG.duracaoMinutos*60000 : 0;

  $("#telaInicio").classList.add("hidden");
  $("#telaProva").classList.remove("hidden");
  $("#topo").classList.remove("hidden");
  document.body.classList.add("emprova");
  $("#topoNome").textContent = aluno.nome.split(" ")[0] + " · " + aluno.turma;
  if(fimEm){ $("#topoTimer").classList.remove("hidden"); tick(); tickTimer = setInterval(tick, 1000); }

  window.addEventListener("beforeunload", avisarSaida);
  if(CONFIG.bloquearCopia && !MODO_TESTE) ligarBloqueioCopia();
  if(CONFIG.telaCheia && !MODO_TESTE){
    try{
      const pedido = document.documentElement.requestFullscreen();
      if(pedido && pedido.catch) pedido.catch(() => {});   // celular pode recusar; segue normal
    }catch(e){}
  }
  /* a vigilância só começa depois que a tela assenta, para que a troca de foco
     do próprio carregamento não seja confundida com o aluno saindo da prova */
  if(CONFIG.encerrarAoSairDaAba && !MODO_TESTE) setTimeout(ligarVigilancia, 1200);

  render();
}

function avisarSaida(e){ if(!enviando){ e.preventDefault(); e.returnValue = ""; } }

/* ---------- vigilância de troca de aba ---------- */
function ligarVigilancia(){
  vigiando = true;
  document.addEventListener("visibilitychange", aoSair);
  window.addEventListener("blur", aoSair);
}
function desligarVigilancia(){
  vigiando = false;
  document.removeEventListener("visibilitychange", aoSair);
  window.removeEventListener("blur", aoSair);
}
function aoSair(ev){
  if(!vigiando || enviando) return;
  if(ev.type === "visibilitychange" && !document.hidden) return;
  saidasDaAba++;
  if(avisosRestantes > 0){
    avisosRestantes--;
    salvarRascunho();
    $("#avisoTexto").innerHTML = `Você saiu da tela da prova. Este é o seu único aviso:
      <strong>na próxima vez a prova será encerrada e entregue automaticamente</strong>,
      com as respostas marcadas até aquele momento.`;
    $("#modalAviso").classList.remove("hidden");
    return;
  }
  desligarVigilancia();
  finalizar("saida");
}
$("#avisoOk").onclick = () => $("#modalAviso").classList.add("hidden");

/* ---------- bloqueio de cópia ---------- */
function ligarBloqueioCopia(){
  const barrar = e => e.preventDefault();
  document.addEventListener("contextmenu", barrar);
  document.addEventListener("copy", barrar);
  document.addEventListener("cut", barrar);
  document.addEventListener("paste", barrar);
  document.addEventListener("keydown", e => {
    const k = (e.key || "").toLowerCase();
    if((e.ctrlKey || e.metaKey) && ["c","x","v","p","s","u"].includes(k)) e.preventDefault();
  });
}

function tick(){
  const resta = Math.max(0, fimEm - Date.now());
  const m = Math.floor(resta/60000), s = Math.floor((resta%60000)/1000);
  const el = $("#topoTimer");
  el.textContent = String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  el.className = "timer" + (resta <= 60000 ? " critico" : resta <= 300000 ? " alerta" : "");
  if(resta <= 0){ clearInterval(tickTimer); desligarVigilancia(); finalizar("tempo"); }
}

function render(){
  const q = prova[atual];
  $("#areaQuestao").innerHTML = `
    <article class="card q">
      <div class="num">Questão ${atual+1} de ${prova.length}</div>
      <div class="enun">${esc(q.enunciado)}</div>
      ${q.imagem ? `<img src="${esc(q.imagem)}" alt="" style="max-width:100%;border-radius:10px;margin-top:12px">` : ""}
      ${q.codigo ? `<pre>${esc(q.codigo)}</pre>` : ""}
      <div class="alts">
        ${q.alternativas.map((a,i) => `
          <label class="alt${respostas[atual]===i?" sel":""}" data-i="${i}">
            <span class="letra">${LETRAS[i]}</span>
            <span class="txt">${esc(a.texto)}</span>
          </label>`).join("")}
      </div>
    </article>`;

  $("#areaQuestao").querySelectorAll(".alt").forEach(el => {
    el.addEventListener("click", () => {
      respostas[atual] = Number(el.dataset.i);
      salvarRascunho();
      render();
      if(atual < prova.length - 1) setTimeout(() => { atual++; render(); scrollTo({top:0,behavior:"smooth"}); }, 220);
    });
  });

  $("#grade").innerHTML = prova.map((_,i) =>
    `<button class="gbtn${respostas[i]!==null?" feita":""}${i===atual?" atual":""}" data-i="${i}">${i+1}</button>`).join("");
  $("#grade").querySelectorAll(".gbtn").forEach(b => {
    b.addEventListener("click", () => { atual = Number(b.dataset.i); render(); scrollTo({top:0,behavior:"smooth"}); });
  });

  const feitas = respostas.filter(r => r !== null).length;
  $("#contador").innerHTML = `<strong>${feitas}</strong> de <strong>${prova.length}</strong> respondidas`;
  $("#topoBarra").style.width = (feitas/prova.length*100) + "%";
  $("#btnAnt").disabled  = atual === 0;
  $("#btnProx").disabled = atual === prova.length - 1;
}

$("#btnAnt").onclick  = () => { if(atual>0){ atual--; render(); scrollTo({top:0,behavior:"smooth"}); } };
$("#btnProx").onclick = () => { if(atual<prova.length-1){ atual++; render(); scrollTo({top:0,behavior:"smooth"}); } };

function salvarRascunho(){
  if(MODO_TESTE) return;
  store.set(CHAVE + "_rascunho", JSON.stringify({
    nome:aluno.nome, prova, respostas, inicioEm, atual, saidasDaAba, avisosRestantes
  }));
}

$("#btnFinalizar").onclick = () => {
  const branco = respostas.filter(r => r === null).length;
  if(branco && CONFIG.exigirTodasRespondidas){
    $("#avisoTexto").textContent = `Ainda faltam ${branco} ${branco===1?"questão":"questões"}. Responda todas antes de enviar.`;
    $("#modalAviso").classList.remove("hidden");
    return;
  }
  $("#modalTexto").innerHTML = branco
    ? `Você deixou <strong>${branco}</strong> ${branco===1?"questão em branco":"questões em branco"}. Depois de enviar não é possível alterar.`
    : "Todas as questões estão respondidas. Depois de enviar não é possível alterar.";
  $("#modal").classList.remove("hidden");
};
$("#modalNao").onclick = () => $("#modal").classList.add("hidden");
$("#modalSim").onclick = () => { $("#modal").classList.add("hidden"); desligarVigilancia(); finalizar("normal"); };

/* ============================================================
   CORREÇÃO E ENVIO
   ============================================================ */
function corrigir(){
  let acertos = 0, pontos = 0, total = 0;
  const detalhe = prova.map((q,i) => {
    total += q.valor;
    const escolhida = respostas[i];
    const certa = escolhida !== null && q.alternativas[escolhida].correta;
    if(certa){ acertos++; pontos += q.valor; }
    const iCerta = q.alternativas.findIndex(a => a.correta);
    return {
      questao: q.original, enunciado: q.enunciado,
      marcada: escolhida === null ? "-" : LETRAS[escolhida],
      texto: escolhida === null ? "(em branco)" : q.alternativas[escolhida].texto,
      certa, certaTexto: q.alternativas[iCerta].texto
    };
  });
  return { acertos, pontos, total, nota: total ? +(pontos/total*10).toFixed(1) : 0, detalhe };
}

function gerarProtocolo(){
  const s = aluno.nome + aluno.turma + inicioEm + Date.now();
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h.toString(36).toUpperCase().padStart(6,"0").slice(-6);
}

const MOTIVOS = {
  normal: "", tempo: "tempo esgotado", saida: "saiu da tela da prova"
};

async function finalizar(motivo){
  if(enviando) return;
  enviando = true;
  clearInterval(tickTimer);
  desligarVigilancia();
  window.removeEventListener("beforeunload", avisarSaida);
  document.body.classList.remove("emprova");
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}

  const r = corrigir();
  const protocolo = gerarProtocolo();

  const envio = {
    protocolo,
    nome: (MODO_TESTE ? "[TESTE] " : "") + aluno.nome,
    turma: aluno.turma,
    disciplina: (CONFIG.disciplinaPorTurma && CONFIG.disciplinaPorTurma[aluno.turma]) || CONFIG.disciplina,
    prova: CONFIG.titulo,
    acertos: r.acertos,
    totalQuestoes: prova.length,
    nota: r.nota,
    duracaoSegundos: Math.round((Date.now() - inicioEm)/1000),
    encerradaPor: MOTIVOS[motivo] || "",
    saidasDaAba,
    matriculaVerificada: aluno.naoVerificado ? "NÃO" : "sim",
    enviadoEm: new Date().toISOString(),
    respostas: r.detalhe.map(d => `${d.questao}:${d.marcada}${d.certa?"✓":"✗"}`).join(" | ")
  };

  $("#topo").classList.add("hidden");
  $("#telaProva").classList.add("hidden");
  $("#telaFim").classList.remove("hidden");
  scrollTo({top:0});

  mostrarResultado(r, envio, motivo, "enviando");
  const resp = await enviarPlanilha(envio);
  mostrarResultado(r, envio, motivo,
    resp === null ? "local" : resp && resp.ok ? "ok" : resp && resp.duplicado ? "duplicado" : "falhou");

  if(!MODO_TESTE){
    store.del(CHAVE + "_rascunho");
    store.set(CHAVE + "_enviado", JSON.stringify({ nome: aluno.nome, protocolo }));
  }
}

async function enviarPlanilha(dados){
  if(!CONFIG.urlPlanilha) return null;
  for(let tentativa = 1; tentativa <= 3; tentativa++){
    try{
      // text/plain evita o "preflight", que o Apps Script não responde
      const resp = await fetch(CONFIG.urlPlanilha, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(dados),
        redirect: "follow"
      });
      if(resp.ok){
        try{ return await resp.json(); }catch(e){ return { ok:true }; }
      }
    }catch(e){
      if(tentativa === 3){
        try{  // último recurso: envio às cegas, funciona mesmo sem CORS
          await fetch(CONFIG.urlPlanilha, {
            method:"POST", mode:"no-cors",
            headers:{ "Content-Type":"text/plain;charset=utf-8" },
            body: JSON.stringify(dados)
          });
          return { ok:true };
        }catch(e2){}
      }
      await new Promise(r => setTimeout(r, 800 * tentativa));
    }
  }
  return { ok:false };
}

/* ============================================================
   TELA 3 — RESULTADO
   ============================================================ */
function mostrarResultado(r, envio, motivo, status){
  const statusHtml =
    status === "enviando"  ? `<div class="aviso info">Enviando suas respostas…</div>` :
    status === "ok"        ? `<div class="aviso ok">Respostas registradas com sucesso.</div>` :
    status === "duplicado" ? `<div class="aviso warn">A planilha já tinha um registro seu para esta prova.
                               A entrega anterior foi mantida.</div>` :
    status === "falhou"    ? `<div class="aviso err">Não foi possível registrar automaticamente.
                               <strong>Mostre o protocolo abaixo ao professor antes de sair.</strong></div>` :
    status === "local"     ? `<div class="aviso warn">A planilha ainda não foi configurada
                               (<code>urlPlanilha</code> está vazio), então esta prova
                               <strong>não foi gravada</strong> em lugar nenhum.</div>` : "";

  const notaHtml = CONFIG.mostrarNotaNaHora
    ? `<p class="small mut" style="margin-top:18px">Sua nota</p>
       <div class="nota" style="color:${r.nota>=6?"var(--ok)":"var(--err)"}">${r.nota.toFixed(1)}</div>
       <p class="small mut">${r.acertos} de ${prova.length} questões</p>`
    : `<div class="aviso info" style="margin-top:18px">Sua prova foi entregue.
       O professor divulgará as notas depois da correção.</div>`;

  const alerta =
    motivo === "saida" ? `<div class="aviso err">Sua prova foi <strong>encerrada porque você saiu da tela</strong>.
                          Ela foi entregue com as respostas marcadas até aquele momento.</div>` :
    motivo === "tempo" ? `<div class="aviso warn">O tempo acabou e a prova foi enviada automaticamente.</div>` : "";

  $("#fimConteudo").innerHTML = `
    <h1>Prova entregue</h1>
    <p class="mut small">${esc(aluno.nome)} · ${esc(aluno.turma)}</p>
    ${MODO_TESTE ? `<div class="aviso warn">Envio marcado como <strong>TESTE</strong> — não conta como entrega de aluno.</div>` : ""}
    ${alerta}
    ${notaHtml}
    <p class="small mut" style="margin-top:24px">Protocolo de entrega</p>
    <div class="protocolo">${esc(envio.protocolo)}</div>
    <p class="tiny mut" style="margin-top:10px">Anote ou mostre este código ao professor.</p>
    ${statusHtml}`;

  if((CONFIG.mostrarGabarito || MODO_TESTE) && status !== "enviando"){
    $("#fimGabarito").innerHTML = `
      <div class="card" style="padding:20px;margin-top:18px">
        <h2>Gabarito${MODO_TESTE ? " (visão do professor)" : ""}</h2>
        <p class="tiny mut" style="margin:2px 0 0">Na ordem em que as questões aparecem no arquivo.</p>
        ${r.detalhe.map(d => `
          <div class="alt ${d.certa?"certa":"errada"}" style="margin-top:10px;cursor:default;align-items:flex-start">
            <span class="letra">${d.certa?"✓":"✗"}</span>
            <span class="txt">
              <strong>Questão ${d.questao}</strong>
              ${MODO_TESTE ? `<br><span class="tiny mut">${esc(d.enunciado)}</span>` : ""}
              <br>Marcada: ${esc(d.texto)}
              ${d.certa ? "" : `<br><strong>Correta: ${esc(d.certaTexto)}</strong>`}
            </span>
          </div>`).join("")}
      </div>`;
  }
}

montarEntrada();
})();
</script>
